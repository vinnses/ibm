name: ibm

services:
  web:
    build:
      context: ./site
      dockerfile: Dockerfile
    image: ibm-web:dev
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-5173}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edge

  dash:
    build:
      context: ./analises
      dockerfile: Dockerfile
    image: ibm-dash:dev
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8050/analises/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - edge

  router:
    image: nginx:stable-alpine@sha256:985220252f3863977e468f611ef118ebd01421289dd86ee1ae99cb068c3bce2b
    entrypoint: ["nginx", "-g", "daemon off;"]
    user: "101:101"
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    depends_on:
      web:
        condition: service_healthy
      dash:
        condition: service_healthy
    ports:
      - "${ROUTER_BIND:-127.0.0.1}:${ROUTER_PORT:-5174}:8081"
    volumes:
      - ./infrastructure/router/nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:size=4m,mode=1777
      - /var/cache/nginx:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edge

  code:
    image: ghcr.io/coder/code-server:4.135.0@sha256:ccd326184d71efc5ebb94155eda7bb30153902342a35dbc8525450d81aa55012
    restart: unless-stopped
    init: true
    user: "1000:1000"
    working_dir: /home/coder/project
    command:
      - --bind-addr
      - 0.0.0.0:8080
      - --auth
      - password
      - /home/coder/project
    environment:
      PASSWORD: "${CODE_SERVER_PASSWORD:?Set CODE_SERVER_PASSWORD in the ignored local .env file}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    ports:
      - "${CODE_BIND:-127.0.0.1}:${CODE_PORT:-8080}:8080"
    volumes:
      - ./:/home/coder/project
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dev

  tailscale:
    image: tailscale/tailscale:v1.102.3@sha256:8c42c4574ab066384fcb72f69e086a2ff1dd3652eb6f56856cee34bcf0d2f680
    restart: unless-stopped
    init: true
    read_only: true
    depends_on:
      router:
        condition: service_healthy
    environment:
      TS_AUTHKEY: "${TS_AUTHKEY:-}"
      TS_AUTH_ONCE: "true"
      TS_ACCEPT_DNS: "false"
      TS_HOSTNAME: ibm
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "0.0.0.0:9002"
      TS_BOOT_TIMEOUT: "24h"
      TS_SERVE_CONFIG: /config/funnel.json
      TS_EXTRA_ARGS: "${TS_EXTRA_ARGS:-}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./infrastructure/tailscale/funnel.json:/config/funnel.json:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/run/tailscale:size=4m,mode=0755
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      edge: {}
      dev:
        gw_priority: 1

networks:
  edge:
    name: ibm_edge
  dev:
    name: ibm_dev

volumes:
  tailscale_state:
